# 日志配置
[log]
    # 日志输出级别，可选：debug | info | warn | error | fatal | panic
    level = "debug"
    # 日志同步器；这里只启用文件同步器
    terminals = ["file"]
    # 时间格式，使用 Go 标准库时间格式
    timeFormat = "2006/01/02 15:04:05.000000"
    # 堆栈的最低输出级别，可选：debug | info | warn | error | fatal | panic
    stackLevel = "error"
    # 是否输出调用文件的完整路径
    callFullPath = false
    [log.file]
        # 日志输出文件
        path = "./log/xbase.log"
        # 日志输出格式，可选：text | json
        format = "text"
        # 文件最大留存时间，支持 d（天）、h（时）、m（分）、s（秒）
        maxAge = "7d"
        # 单个日志文件最大尺寸，支持 B、KB、MB、GB 等单位
        maxSize = "100MB"
        # 文件切割方式，可选：none | year | month | week | day | hour
        rotate = "day"
        # 切割后是否压缩旧日志
        compress = false
        # 是否启用按日志级别分类存储
        classifiedStorage = false
